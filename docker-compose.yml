services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres is reachable on the internal compose network (hostname "db")
    # for the app, but is NOT published to the host. If you need a psql
    # session, use `docker compose exec db psql -U otisak -d otisak`.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: otisak
      POSTGRES_PASSWORD: otisak
      POSTGRES_DB: otisak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otisak -d otisak"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: otisak-app:latest
    restart: unless-stopped
    ports:
      # HOST_PORT comes from .env (managed by deploy.sh --port). The app
      # always listens on 3001 inside the container.
      - "${HOST_PORT:-3000}:3001"
    environment:
      DATABASE_URL: postgresql://otisak:otisak@db:5432/otisak
      # SESSION_SECRET MUST be supplied externally (e.g. via .env file or
      # `SESSION_SECRET=... docker compose up`). The server refuses to start
      # if this value is empty, the placeholder, or shorter than 16 chars.
      # deploy.sh auto-generates a 64-char hex value into .env on first run.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set — see deploy.sh or set it via .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:${HOST_PORT:-3000}}
      PORT: 3001
      NODE_ENV: production
      CLIENT_DIST_PATH: /app/client/dist
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Node 20 ships fetch globally, so we don't need curl/wget in the
      # runtime image. Exit 1 on any non-2xx so docker marks unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    # Chromium (puppeteer) writes profile + crash dumps to /tmp. Giving it a
    # tmpfs keeps writes off the union FS and gets cleared on container exit.
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
